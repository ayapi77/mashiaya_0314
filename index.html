<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aya AI Trade Signal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyber: {
              bg: '#0a0f1a',
              panel: 'rgba(15, 20, 35, 0.4)',
              border: 'rgba(255, 255, 255, 0.08)',
              neon: '#b388ff',
              blue: '#00e5ff',
              text: '#e2e8f0',
              muted: 'rgba(255, 255, 255, 0.5)'
            }
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', 'monospace'],
            sans: ['"Inter"', 'sans-serif'],
            elegant: ['"Montserrat"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: linear-gradient(135deg, #050810 0%, #0a0f1a 50%, #110c1a 100%);
      color: #e2e8f0;
    }
    .glass-panel {
      background: rgba(15, 20, 35, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }
    .elegant-button {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .elegant-button:hover {
      border-color: rgba(179, 136, 255, 0.4);
      background: rgba(179, 136, 255, 0.1);
      box-shadow: 0 0 20px rgba(179, 136, 255, 0.15);
      color: #fff;
    }
    .tab-nikkei.active, .radio-nikkei:checked + div {
      border-color: rgba(0, 229, 255, 0.6);
      background: rgba(0, 229, 255, 0.15);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
      color: #00e5ff;
    }
    .tab-sp500.active, .radio-sp500:checked + div {
      border-color: rgba(179, 136, 255, 0.6);
      background: rgba(179, 136, 255, 0.15);
      box-shadow: 0 0 20px rgba(179, 136, 255, 0.3);
      color: #b388ff;
    }
    .tab-gold.active, .radio-gold:checked + div {
      border-color: rgba(255, 215, 0, 0.6);
      background: rgba(255, 215, 0, 0.15);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
      color: #ffd700;
    }
    .aurora-text {
      background: linear-gradient(to right, #00e5ff, #b388ff, #ff80ab);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(179, 136, 255, 0.4);
    }
    .aurora-bg {
      background: linear-gradient(to right, #00e5ff, #b388ff, #ff80ab);
    }
    .terminal {
      background-color: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-family: 'JetBrains Mono', monospace;
      position: relative;
    }
    .terminal::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.1),
        rgba(0, 0, 0, 0.1) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 10;
    }
    .terminal-content {
      position: relative;
      z-index: 20;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(179, 136, 255, 0.3);
    }
    .loader {
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top: 2px solid #b388ff;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans text-white">
  <!-- Header -->
  <header class="border-b border-white/10 bg-black/20 backdrop-blur-md px-6 py-4 flex items-center justify-between shrink-0">
    <div class="flex items-center">
      <h1 class="text-2xl sm:text-3xl font-elegant font-light tracking-[0.15em] aurora-text">AYA AI Trade Signal</h1>
    </div>
    <div class="text-xs text-cyber-muted font-mono tracking-wider" id="clock">--:--:--</div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-4 p-4">
    
    <!-- Left Column: Charts & News -->
    <div class="flex flex-col gap-4 min-h-0">
      <!-- Chart Area -->
      <div class="glass-panel rounded-3xl flex flex-col h-[350px] lg:h-[500px] overflow-hidden relative min-h-0">
        <div class="p-3 border-b border-white/10 flex gap-2 bg-black/20 backdrop-blur-md z-10 relative shrink-0">
          <button class="elegant-button chart-tab tab-nikkei active px-5 py-2 text-xs font-medium tracking-wider rounded-xl" onclick="changeChart('OANDA:JP225USD', this)">Nikkei 225</button>
          <button class="elegant-button chart-tab tab-sp500 px-5 py-2 text-xs font-medium tracking-wider rounded-xl" onclick="changeChart('OANDA:SPX500USD', this)">S&P500</button>
          <button class="elegant-button chart-tab tab-gold px-5 py-2 text-xs font-medium tracking-wider rounded-xl" onclick="changeChart('OANDA:XAUUSD', this)">Gold</button>
        </div>
        <div class="flex-1 w-full relative min-h-0">
          <div id="tradingview_chart" class="absolute inset-0"></div>
        </div>
      </div>

      <!-- News Area -->
      <div class="glass-panel rounded-3xl flex flex-col h-[350px] lg:h-[400px] overflow-hidden relative min-h-0">
        <div class="bg-black/20 backdrop-blur-md border-b border-white/10 px-5 py-3 flex items-center justify-between shrink-0">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-cyber-blue animate-pulse shadow-[0_0_8px_rgba(0,229,255,0.6)]"></span>
            <span class="text-[10px] text-cyber-blue font-mono tracking-widest" id="news_title">LATEST_NEWS (Nikkei 225)</span>
          </div>
          <button onclick="fetchJapaneseNews(currentSymbol, true)" class="text-[10px] text-cyber-muted hover:text-white font-mono transition-colors">RELOAD</button>
        </div>
        <div class="flex-1 overflow-y-auto relative" id="custom_news_widget">
          <!-- News items will be injected here -->
        </div>
      </div>
    </div>

    <!-- Right Column: AI & Controls -->
    <div class="flex flex-col gap-4">
      
      <!-- API Key Setup -->
      <div class="glass-panel rounded-3xl p-6 shrink-0">
        <h2 class="text-xs text-cyber-muted mb-4 font-mono flex items-center gap-2 tracking-widest">
          <span class="text-cyber-blue">■</span> SYSTEM CONFIG
        </h2>
        <div class="flex gap-3">
          <input type="password" id="apiKey" placeholder="Dify API Key" class="flex-1 bg-black/30 border border-white/10 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-[#b388ff] text-white font-mono transition-colors">
          <button onclick="saveApiKey()" class="bg-white/5 text-white border border-white/10 hover:bg-[#b388ff]/20 hover:border-[#b388ff]/50 hover:shadow-[0_0_15px_rgba(179,136,255,0.3)] px-6 py-2 rounded-xl text-sm font-medium tracking-wider transition-all duration-300">
            SAVE
          </button>
        </div>
      </div>

      <!-- Target Selection -->
      <div class="glass-panel rounded-3xl p-6 shrink-0">
        <h2 class="text-xs text-cyber-muted mb-4 font-mono flex items-center gap-2 tracking-widest">
          <span class="text-cyber-neon">■</span> TARGET ASSET
        </h2>
        <div class="grid grid-cols-3 gap-3">
          <label class="cursor-pointer">
            <input type="radio" name="target" value="Nikkei 225" class="radio-btn radio-nikkei sr-only" onchange="syncFromRadio('OANDA:JP225USD')" checked>
            <div class="elegant-button rounded-xl p-3 text-center">
              <div class="text-sm font-medium text-white mb-1">Nikkei 225</div>
              <div class="text-[10px] text-cyber-muted font-mono">国内株式</div>
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="target" value="S&P500" class="radio-btn radio-sp500 sr-only" onchange="syncFromRadio('OANDA:SPX500USD')">
            <div class="elegant-button rounded-xl p-3 text-center">
              <div class="text-sm font-medium text-white mb-1">S&P500</div>
              <div class="text-[10px] text-cyber-muted font-mono">米国株式</div>
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="target" value="Gold" class="radio-btn radio-gold sr-only" onchange="syncFromRadio('OANDA:XAUUSD')">
            <div class="elegant-button rounded-xl p-3 text-center">
              <div class="text-sm font-medium text-white mb-1">Gold</div>
              <div class="text-[10px] text-cyber-muted font-mono">コモディティ</div>
            </div>
          </label>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="glass-panel rounded-3xl p-6 shrink-0">
        <h2 class="text-xs text-cyber-muted mb-4 font-mono flex items-center gap-2 tracking-widest">
          <span class="text-cyber-blue">■</span> ANALYSIS MODE
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <button onclick="askAI(1)" class="elegant-button rounded-xl p-4 text-left group relative overflow-hidden">
            <div class="absolute top-0 left-0 w-1 h-full aurora-bg opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
            <div class="text-xs font-mono text-cyber-blue mb-1 opacity-70 group-hover:text-[#b388ff] transition-colors">ACTION 01</div>
            <div class="text-sm font-medium text-white mb-1">今日の動向</div>
            <div class="text-[10px] text-cyber-muted">ノイズ判定</div>
          </button>
          <button onclick="askAI(2)" class="elegant-button rounded-xl p-4 text-left group relative overflow-hidden">
            <div class="absolute top-0 left-0 w-1 h-full aurora-bg opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
            <div class="text-xs font-mono text-cyber-blue mb-1 opacity-70 group-hover:text-[#b388ff] transition-colors">ACTION 02</div>
            <div class="text-sm font-medium text-white mb-1">反発確率の分析</div>
            <div class="text-[10px] text-cyber-muted">テクニカル視点</div>
          </button>
          <button onclick="askAI(3)" class="elegant-button rounded-xl p-4 text-left group relative overflow-hidden">
            <div class="absolute top-0 left-0 w-1 h-full aurora-bg opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
            <div class="text-xs font-mono text-cyber-blue mb-1 opacity-70 group-hover:text-[#b388ff] transition-colors">ACTION 03</div>
            <div class="text-sm font-medium text-white mb-1">最終判断</div>
            <div class="text-[10px] text-cyber-muted">ワーストケース</div>
          </button>
          <button onclick="askAI(4)" class="elegant-button rounded-xl p-4 text-left group relative overflow-hidden">
            <div class="absolute top-0 left-0 w-1 h-full aurora-bg opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
            <div class="text-xs font-mono text-cyber-blue mb-1 opacity-70 group-hover:text-[#b388ff] transition-colors">ACTION 04</div>
            <div class="text-sm font-medium text-white mb-1">実践的リスクヘッジ策</div>
            <div class="text-[10px] text-cyber-muted">防衛戦略</div>
          </button>
        </div>
      </div>

      <!-- Terminal Output -->
      <div class="glass-panel rounded-3xl flex-1 flex flex-col overflow-hidden min-h-[300px]">
        <div class="bg-black/20 backdrop-blur-md border-b border-white/10 px-5 py-3 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="flex gap-1.5">
              <div class="w-3 h-3 rounded-full bg-[#ff5f56]"></div>
              <div class="w-3 h-3 rounded-full bg-[#ffbd2e]"></div>
              <div class="w-3 h-3 rounded-full bg-[#27c93f]"></div>
            </div>
            <span class="text-[10px] text-cyber-muted font-mono ml-3">DIFY_AI_TERMINAL</span>
          </div>
          <div class="flex items-center gap-3">
            <button onclick="openHistory()" class="text-[10px] text-[#b388ff] hover:text-white font-mono transition-colors">HISTORY</button>
            <button onclick="clearTerminal()" class="text-[10px] text-cyber-muted hover:text-white font-mono transition-colors">CLEAR</button>
          </div>
        </div>
        <div class="terminal flex-1 overflow-hidden rounded-b-3xl">
          <div id="terminal-output" class="terminal-content h-full p-5 overflow-y-auto text-sm leading-relaxed whitespace-pre-wrap">
            <div class="text-cyber-muted mb-4 font-mono text-xs">Aya AI Trade Signal System Initialized.
Connected to global markets.
Waiting for user input...</div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- History Modal -->
  <div id="history-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4 opacity-0 transition-opacity duration-300">
    <div class="glass-panel rounded-3xl w-full max-w-3xl max-h-[80vh] flex flex-col overflow-hidden border border-[#b388ff]/30 shadow-[0_0_30px_rgba(179,136,255,0.2)] transform scale-95 transition-transform duration-300" id="history-modal-content">
      <div class="p-4 border-b border-white/10 flex justify-between items-center bg-black/40 shrink-0">
        <h3 class="text-sm font-mono text-[#b388ff] tracking-widest flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-[#b388ff] shadow-[0_0_8px_rgba(179,136,255,0.6)]"></span>
          ANALYSIS LOGS
        </h3>
        <button onclick="closeHistory()" class="text-cyber-muted hover:text-white text-lg leading-none">&times;</button>
      </div>
      <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-4" id="history-list">
        <!-- History items will be injected here -->
      </div>
    </div>
  </div>

  <script src="https://s3.tradingview.com/tv.js"></script>
  <script>
    let chatHistory = JSON.parse(localStorage.getItem('aya_chat_history') || '[]');
    // --- Clock ---
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').innerText = now.toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
    }, 1000);

    // --- TradingView Chart ---
    let tvWidget = null;
    function initChart(symbol) {
      if (typeof TradingView === 'undefined') {
        setTimeout(() => initChart(symbol), 100);
        return;
      }
      document.getElementById('tradingview_chart').innerHTML = '';
      tvWidget = new TradingView.widget({
        "autosize": true,
        "symbol": symbol,
        "interval": "D",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "ja",
        "enable_publishing": false,
        "backgroundColor": "#111111",
        "gridColor": "#222222",
        "hide_top_toolbar": false,
        "hide_legend": false,
        "save_image": false,
        "container_id": "tradingview_chart"
      });
    }

    function changeChart(symbol, btn) {
      document.querySelectorAll('.chart-tab').forEach(b => b.classList.remove('active'));
      if (btn) {
        btn.classList.add('active');
      } else {
        const btnMatch = document.querySelector(`button[onclick="changeChart('${symbol}', this)"]`);
        if (btnMatch) btnMatch.classList.add('active');
      }
      
      // Sync right radio button
      const symbolToTarget = {
        'OANDA:JP225USD': 'Nikkei 225',
        'OANDA:SPX500USD': 'S&P500',
        'OANDA:XAUUSD': 'Gold'
      };
      const targetValue = symbolToTarget[symbol];
      if (targetValue) {
        const radio = document.querySelector(`input[name="target"][value="${targetValue}"]`);
        if (radio) radio.checked = true;
      }

      initChart(symbol);
      fetchJapaneseNews(symbol);
    }

    function syncFromRadio(symbol) {
      const btnMatch = document.querySelector(`button[onclick="changeChart('${symbol}', this)"]`);
      changeChart(symbol, btnMatch);
    }

    initChart('OANDA:JP225USD');

    // --- Japanese News Feed ---
    let currentSymbol = 'OANDA:JP225USD';
    const newsCache = {};
    const newsQueries = {
      'OANDA:JP225USD': { query: '日経平均 OR 日本株 OR 国内株式', label: 'Nikkei 225' },
      'OANDA:SPX500USD': { query: 'S&P500 OR 米国株 OR NYダウ', label: 'S&P500' },
      'OANDA:XAUUSD': { query: '金相場 OR ゴールド OR 金価格', label: 'Gold' }
    };

    async function fetchJapaneseNews(symbol = currentSymbol, forceReload = false) {
      currentSymbol = symbol;
      const config = newsQueries[symbol];
      document.getElementById('news_title').innerText = `LATEST_NEWS (${config.label})`;
      const newsContainer = document.getElementById('custom_news_widget');

      if (!forceReload && newsCache[symbol]) {
        renderNews(newsCache[symbol]);
        return;
      }

      newsContainer.innerHTML = '<div class="p-5 text-cyber-neon font-mono text-xs flex items-center"><span class="loader"></span> ニュースを取得中...</div>';
      
      try {
        // Google News（日本）で各アセットに特化した検索クエリを使用
        const query = encodeURIComponent(config.query);
        const googleNewsUrl = `https://news.google.com/rss/search?q=${query}&hl=ja&gl=JP&ceid=JP:ja`;
        const encodedUrl = encodeURIComponent(googleNewsUrl);
        
        let items = [];
        
        // メイン: rss2json API
        try {
          const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodedUrl}`);
          if (!response.ok) throw new Error('rss2json HTTP error');
          const data = await response.json();
          if (data.status === 'ok' && data.items && data.items.length > 0) {
            items = data.items.map(item => ({
              title: item.title,
              link: item.link,
              pubDate: item.pubDate
            }));
          }
        } catch (e) {
          console.warn('rss2json failed, trying fallback 1...', e);
        }

        // フォールバック1: allorigins API + DOMParser
        if (items.length === 0) {
          try {
            const proxyUrl = `https://api.allorigins.win/get?url=${encodedUrl}`;
            const fbResponse = await fetch(proxyUrl);
            if (!fbResponse.ok) throw new Error('allorigins HTTP error');
            const fbData = await fbResponse.json();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(fbData.contents, "text/xml");
            const xmlItems = xmlDoc.querySelectorAll("item");
            
            for (let i = 0; i < Math.min(xmlItems.length, 15); i++) {
              items.push({
                title: xmlItems[i].querySelector("title")?.textContent || "No Title",
                link: xmlItems[i].querySelector("link")?.textContent || "#",
                pubDate: xmlItems[i].querySelector("pubDate")?.textContent
              });
            }
          } catch (e) {
            console.warn('allorigins failed, trying fallback 2...', e);
          }
        }

        // フォールバック2: codetabs API + DOMParser
        if (items.length === 0) {
          try {
            const proxyUrl = `https://api.codetabs.com/v1/proxy?quest=${encodedUrl}`;
            const fbResponse = await fetch(proxyUrl);
            if (!fbResponse.ok) throw new Error('codetabs HTTP error');
            const textData = await fbResponse.text();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(textData, "text/xml");
            const xmlItems = xmlDoc.querySelectorAll("item");
            
            for (let i = 0; i < Math.min(xmlItems.length, 15); i++) {
              items.push({
                title: xmlItems[i].querySelector("title")?.textContent || "No Title",
                link: xmlItems[i].querySelector("link")?.textContent || "#",
                pubDate: xmlItems[i].querySelector("pubDate")?.textContent
              });
            }
          } catch (e) {
            console.warn('codetabs failed...', e);
          }
        }

        if (items.length === 0) {
          throw new Error('No news items found');
        }

        // キャッシュに保存して描画
        newsCache[symbol] = items;
        renderNews(items);
        
      } catch (error) {
        console.error("News Fetch Error:", error);
        newsContainer.innerHTML = `<div class="p-5 text-red-500 font-mono text-xs">ニュースの取得に失敗しました。<br>再読み込みをお試しください。</div>`;
      }
    }

    function renderNews(items) {
      const newsContainer = document.getElementById('custom_news_widget');
      let html = '<div class="p-4 flex flex-col gap-3">';
      items.slice(0, 15).forEach(item => {
        let dateStr = "";
        if (item.pubDate) {
          const date = new Date(item.pubDate);
          dateStr = date.toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }
        html += `
          <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="block bg-white/5 border border-white/10 rounded-xl p-4 hover:border-[#b388ff]/40 hover:bg-white/10 hover:shadow-[0_0_15px_rgba(179,136,255,0.1)] transition-all duration-400 group">
            <div class="text-[10px] text-cyber-muted font-mono mb-2 flex items-center justify-between">
              <span>${dateStr}</span>
              <span class="text-[#b388ff] opacity-0 group-hover:opacity-100 transition-opacity duration-400">READ ↗</span>
            </div>
            <div class="text-sm text-white group-hover:text-[#00e5ff] transition-colors duration-400 leading-relaxed font-medium">${item.title}</div>
          </a>
        `;
      });
      html += '</div>';
      newsContainer.innerHTML = html;
    }

    fetchJapaneseNews();

    // --- API Key Management ---
    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('dify_api_key');
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
      }
    });

    function saveApiKey() {
      const key = document.getElementById('apiKey').value.trim();
      if (key) {
        localStorage.setItem('dify_api_key', key);
        const btn = document.querySelector('button[onclick="saveApiKey()"]');
        const originalText = btn.innerText;
        btn.innerText = 'SAVED!';
        btn.classList.add('aurora-text', 'border-[#b388ff]');
        setTimeout(() => {
          btn.innerText = originalText;
          btn.classList.remove('aurora-text', 'border-[#b388ff]');
        }, 2000);
      } else {
        alert('APIキーを入力してください。');
      }
    }

    // --- Terminal Management ---
    function clearTerminal() {
      const terminal = document.getElementById('terminal-output');
      terminal.innerHTML = `<div class="text-cyber-muted mb-4 font-mono text-xs">Terminal cleared. Waiting for input...</div>`;
    }

    // --- History Management ---
    function openHistory() {
      const modal = document.getElementById('history-modal');
      const list = document.getElementById('history-list');
      list.innerHTML = '';

      if (chatHistory.length === 0) {
        list.innerHTML = '<div class="text-cyber-muted text-sm font-mono text-center py-10">No logs available.</div>';
      } else {
        chatHistory.forEach((item) => {
          let formattedAnswer = item.answer.replace(/\*\*(.*?)\*\*/g, '<span class="text-cyber-neon font-bold">$1</span>');
          formattedAnswer = formattedAnswer.replace(/\n/g, '<br>');

          list.innerHTML += `
            <div class="bg-black/30 border border-white/5 rounded-xl p-4">
              <div class="flex justify-between items-center mb-3 border-b border-white/5 pb-2">
                <span class="text-xs font-mono text-[#00e5ff]">${item.target}</span>
                <span class="text-[10px] font-mono text-cyber-muted">${item.time}</span>
              </div>
              <div class="mb-3">
                <div class="text-[#b388ff] font-mono text-[10px] mb-1">QUERY</div>
                <div class="text-sm text-gray-300 pl-2 border-l border-[#b388ff]/30">${item.query}</div>
              </div>
              <div>
                <div class="text-[#00e5ff] font-mono text-[10px] mb-1">RESPONSE</div>
                <div class="text-sm text-gray-300 pl-2 border-l border-[#00e5ff]/30">${formattedAnswer}</div>
              </div>
            </div>
          `;
        });
      }
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      // Trigger reflow for animation
      void modal.offsetWidth;
      modal.classList.remove('opacity-0');
      document.getElementById('history-modal-content').classList.remove('scale-95');
    }

    function closeHistory() {
      const modal = document.getElementById('history-modal');
      modal.classList.add('opacity-0');
      document.getElementById('history-modal-content').classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }, 300);
    }

    // --- AI Interaction ---
    const prompts = {
      1: "「[ターゲット名]」の現在の急変動の最大の要因は何ですか？数日の短期トレードを前提に、この値動きが『一時的なパニック/熱狂』なのか『トレンドの転換』なのか、市場の温度感を分析して。",
      2: "数日間の短期トレード目線で、現在の「[ターゲット名]」を分析して。過去の高ボラティリティ相場と比較して、ここから数日内に『自律反発する確率』と『さらに下落する確率』のどちらが高いか推測して。",
      3: "「[ターゲット名]」に今日エントリーし、数日後に決済する短期トレードを想定します。今取るべきリスクと期待リターンのバランスは適切ですか？考えうる『最悪のシナリオ』を提示し、客観的に評価して。",
      4: "もし「[ターゲット名]」を今日『買い』でエントリーした場合、数日間の保有中に想定されるリスクを最小限に抑えるための『具体的なリスクヘッジ策（損切りラインや逆相関資産の活用など）』を提案して。"
    };

    async function askAI(mode) {
      const apiKey = localStorage.getItem('dify_api_key');
      if (!apiKey) {
        alert('Dify APIキーを設定・保存してください。');
        document.getElementById('apiKey').focus();
        return;
      }

      const targetEl = document.querySelector('input[name="target"]:checked');
      if (!targetEl) return;
      const targetName = targetEl.value;

      const rawPrompt = prompts[mode];
      const finalPrompt = rawPrompt.replace(/\[ターゲット名\]/g, targetName);

      const terminal = document.getElementById('terminal-output');
      
      // Clear terminal for new query
      terminal.innerHTML = '';
      
      // Add user prompt
      const promptDiv = document.createElement('div');
      promptDiv.className = 'mb-4';
      promptDiv.innerHTML = `<div class="text-[#b388ff] font-mono text-xs mb-1 flex items-center gap-2"><span class="w-1.5 h-1.5 bg-[#b388ff] rounded-full inline-block shadow-[0_0_8px_rgba(179,136,255,0.6)]"></span>USER_QUERY</div><div class="text-white pl-3 border-l border-[#b388ff]/30">${finalPrompt}</div>`;
      terminal.appendChild(promptDiv);

      // Add loading state
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'mb-6 text-cyber-neon font-mono text-xs flex items-center';
      loadingDiv.innerHTML = `<span class="loader"></span> AIが市場を分析中...`;
      terminal.appendChild(loadingDiv);
      terminal.scrollTop = terminal.scrollHeight;

      try {
        const response = await fetch('https://api.dify.ai/v1/chat-messages', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            inputs: {},
            query: finalPrompt,
            response_mode: "streaming",
            conversation_id: "",
            user: "trader-app"
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.message || `HTTP ${response.status}`);
        }

        terminal.removeChild(loadingDiv);

        const answerDiv = document.createElement('div');
        answerDiv.className = 'mb-8';
        answerDiv.innerHTML = `<div class="text-[#00e5ff] font-mono text-xs mb-2 flex items-center gap-2"><span class="w-1.5 h-1.5 bg-[#00e5ff] rounded-full inline-block shadow-[0_0_8px_rgba(0,229,255,0.6)]"></span>AYA_AI_RESPONSE</div><div class="text-gray-200 pl-3 border-l border-[#00e5ff]/30"></div>`;
        terminal.appendChild(answerDiv);
        
        const contentDiv = answerDiv.querySelector('div:last-child');
        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let fullAnswer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');
          
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const dataStr = line.slice(6);
              if (!dataStr.trim()) continue;
              try {
                const dataObj = JSON.parse(dataStr);
                if (dataObj.event === 'message' || dataObj.event === 'agent_message') {
                  fullAnswer += dataObj.answer;
                  let formattedAnswer = fullAnswer.replace(/\*\*(.*?)\*\*/g, '<span class="text-cyber-neon font-bold">$1</span>');
                  formattedAnswer = formattedAnswer.replace(/\n/g, '<br>');
                  contentDiv.innerHTML = formattedAnswer;
                  terminal.scrollTop = terminal.scrollHeight;
                }
              } catch (e) {
                // Ignore parse errors for incomplete chunks
              }
            }
          }
        }

        // Save to history
        chatHistory.unshift({
          time: new Date().toLocaleString('ja-JP', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          target: targetName,
          query: finalPrompt,
          answer: fullAnswer
        });
        
        // Keep only the last 10 logs
        if (chatHistory.length > 10) {
          chatHistory = chatHistory.slice(0, 10);
        }
        localStorage.setItem('aya_chat_history', JSON.stringify(chatHistory));

      } catch (error) {
        if(terminal.contains(loadingDiv)) {
          terminal.removeChild(loadingDiv);
        }
        const errorDiv = document.createElement('div');
        errorDiv.className = 'mb-8';
        errorDiv.innerHTML = `<div class="text-red-500 font-mono text-xs mb-2 flex items-center gap-2"><span class="w-1.5 h-1.5 bg-red-500 rounded-full inline-block shadow-[0_0_5px_#ef4444]"></span>SYSTEM_ERROR</div><div class="text-red-400 pl-3 border-l border-red-500/30">通信に失敗しました: ${error.message}<br>APIキーが正しいか、CORS制約に引っかかっていないか確認してください。</div>`;
        terminal.appendChild(errorDiv);
      }

      terminal.scrollTop = terminal.scrollHeight;
    }
  </script>
</body>
